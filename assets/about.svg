<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset=".5" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#a371f7"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2ea043" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="2" y="2" width="856" height="336" rx="18"/></clipPath>
    <style>
      text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
      .f{opacity:0;animation:in .9s ease forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
      .d4{animation-delay:.85s}.d5{animation-delay:1.1s}.d6{animation-delay:1.35s}
      .d7{animation-delay:1.6s}.d8{animation-delay:1.9s}
      @keyframes in{to{opacity:1}}
      .lbl{font-size:12px;letter-spacing:3px;fill:#7d8590;font-weight:600}
      .name{font-size:34px;font-weight:700;fill:#f0f6fc}
      .role{font-size:15px;font-weight:600}
      .muted{font-size:14px;fill:#8b949e}
      .ct{font-size:15px;font-weight:700;fill:#f0f6fc}
      .cs{font-size:13px;fill:#8b949e}
    </style>
  </defs>

  <!-- tarjeta -->
  <rect x="2" y="2" width="856" height="336" rx="18" fill="#0d1117"/>
  <g clip-path="url(#card)">
    <circle cx="820" cy="20" r="220" fill="url(#glowA)"/>
    <circle cx="40" cy="330" r="200" fill="url(#glowB)"/>
  </g>
  <rect x="2" y="2" width="856" height="336" rx="18" fill="none" stroke="url(#border)" stroke-width="2"/>

  <!-- columna izquierda -->
  <text x="40" y="66" class="lbl f d1">HOLA, SOY</text>
  <text x="40" y="108" class="name f d2">Anderson Cassiani</text>
  <text x="40" y="140" class="role f d3" fill="url(#txt)">Full Stack Developer · Backend &amp; DevOps</text>

  <g class="f d4">
    <path d="M47 166c-4.4 0-8 3.4-8 7.7 0 5.8 8 13.3 8 13.3s8-7.5 8-13.3c0-4.300-3.6-7.7-8-7.7zm0 10.5a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6z" fill="#58a6ff"/>
    <text x="64" y="182" class="muted">Cartagena de Indias, Colombia</text>
  </g>

  <g class="f d5">
    <rect x="40" y="204" width="284" height="34" rx="17" fill="#2ea043" fill-opacity=".12" stroke="#2ea043" stroke-opacity=".5"/>
    <circle cx="60" cy="221" r="5" fill="#3fb950"/>
    <circle cx="60" cy="221" r="5" fill="none" stroke="#3fb950" stroke-width="2">
      <animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0;.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="226" font-size="13.5" font-weight="600" fill="#3fb950">Disponible para nuevos proyectos</text>
  </g>

  <!-- columna derecha: áreas -->
  <g class="f d4">
    <rect x="440" y="36" width="380" height="68" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="440" y="52" width="4" height="36" rx="2" fill="#3fb950"/>
    <text x="462" y="64" class="ct">Backend</text>
    <text x="462" y="86" class="cs">Laravel · Livewire · Filament · Node.js · Django</text>
  </g>
  <g class="f d5">
    <rect x="440" y="114" width="380" height="68" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="440" y="130" width="4" height="36" rx="2" fill="#58a6ff"/>
    <text x="462" y="142" class="ct">Infraestructura</text>
    <text x="462" y="164" class="cs">Linux · Docker · Nginx · AWS · Microsoft 365</text>
  </g>
  <g class="f d6">
    <rect x="440" y="192" width="380" height="68" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="440" y="208" width="4" height="36" rx="2" fill="#a371f7"/>
    <text x="462" y="220" class="ct">Integraciones</text>
    <text x="462" y="242" class="cs">APIs REST · Pasarelas de pago · WhatsApp · IA</text>
  </g>

  <!-- pie -->
  <line x1="40" y1="284" x2="820" y2="284" stroke="#30363d" class="f d7"/>
  <g class="f d8">
    <g transform="translate(50 310)">
      <g>
        <path d="M-7 -11h14M-7 11h14M-5.5 -11c0 6 5.5 7 5.5 11s-5.5 5-5.5 11M5.5 -11c0 6-5.5 7-5.5 11s5.5 5 5.5 11" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round"/>
        <path d="M-3.5 -6h7l-3.5 4.5z" fill="#3fb950"/>
        <path d="M0 4l4 5h-8z" fill="#58a6ff"/>
        <animateTransform attributeName="transform" type="rotate" values="0;0;180;180" keyTimes="0;.7;.85;1" dur="3s" repeatCount="indefinite"/>
      </g>
    </g>
    <text x="68" y="316" font-size="18" font-weight="700" fill="url(#txt)">#TodoEsUnProceso</text>
  </g>
</svg>
